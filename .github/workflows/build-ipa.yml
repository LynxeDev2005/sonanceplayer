name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme to build (leave blank to auto-detect the first scheme)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Sonance
  COCOAPODS_DISABLE_STATS: "true"

jobs:
  build:
    name: Build sideloadable IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select latest Xcode toolchain (Swift 6.2+)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          # Only match versioned "Xcode_X.Y.app" bundles - the bare
          # "Xcode.app" symlink some images ship confuses `sort -V`.
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            echo "No versioned Xcode_*.app found, keeping the runner default."
          fi
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply Swift 6.2+ compatibility patches
        run: node scripts/patch-expo-modules-jsi.js

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Inject Podfile build settings for Swift concurrency
        run: node scripts/patch-podfile.js

      - name: Ensure JSI patches applied
        run: node scripts/patch-expo-modules-jsi.js

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          # Podfile.lock doesn't exist yet at this point (prebuild --clean
          # wipes ios/ every run), so key on the lockfile that actually
          # determines native dependency versions.
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          if [ -f ios/Podfile ]; then
            pod install --project-directory=ios
          else
            echo "No Podfile found in ios/, skipping pod install."
          fi

      - name: Build without Apple signing assets
        shell: bash
        env:
          GCC_WARN_INHIBIT_ALL_WARNINGS: YES
          SWIFT_SUPPRESS_WARNINGS: 1
          SCHEME_OVERRIDE: ${{ inputs.scheme }}
        run: |
          set -euo pipefail

          # Debug: list ios directory contents
          echo "=== iOS directory contents ==="
          ls -la ios/

          # Find workspace
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "ERROR: No .xcworkspace found in ios/"
            exit 1
          fi
          echo "Found workspace: $workspace"

          # Find scheme (or use the manual override from workflow_dispatch)
          if [ -n "${SCHEME_OVERRIDE:-}" ]; then
            scheme="$SCHEME_OVERRIDE"
            echo "Using scheme override: $scheme"
          else
            scheme="$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{found=1; next} found && NF {gsub(/^[[:space:]]+/, ""); print; exit}')"
          fi
          if [ -z "$scheme" ]; then
            echo "ERROR: No scheme found in workspace"
            exit 1
          fi
          echo "Building scheme: $scheme"
          echo "Starting xcodebuild..."

          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            SWIFT_STRICT_CONCURRENCY=off \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "ERROR: No .app bundle found in build products"
            exit 1
          fi
          echo "Found app bundle: $app_path"

          rm -rf package "${APP_NAME}-unsigned.ipa"
          mkdir -p package/Payload
          cp -R "$app_path" package/Payload/
          (
            cd package
            zip -qry "../${APP_NAME}-unsigned.ipa" Payload
          )

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 14
