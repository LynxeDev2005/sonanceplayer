name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sideloadable IPA
    # Expo SDK 57 requires Xcode 26.4+ (Swift 6.2+). macOS 15's default
    # Xcode 16.4 toolchain cannot resolve Expo's Apple Swift packages.
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple build toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Clean build caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/.cocoapods/repos/master

      - name: Generate the iOS project and install pods
        run: npx expo prebuild --platform ios --non-interactive --clean

      - name: Clean pod caches
        run: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          pod cache clean --all

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --repo-update --verbose

      - name: Build without Apple signing assets
        shell: bash
        run: |
          set -euo pipefail
          
          # Debug: list ios directory contents
          echo "=== iOS directory contents ==="
          ls -la ios/
          
          # Find workspace and scheme
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "ERROR: No .xcworkspace found in ios/"
            echo "=== Full ios/ structure ==="
            find ios -type f -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20
            exit 1
          fi
          
          echo "Found workspace: $workspace"
          
          scheme="$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{found=1; next} found && NF {gsub(/^[[:space:]]+/, ""); print; exit}')"
          if [ -z "$scheme" ]; then
            echo "ERROR: No scheme found in workspace"
            echo "=== xcodebuild -list output ==="
            xcodebuild -list -workspace "$workspace" 2>/dev/null || true
            exit 1
          fi
          
          echo "Found scheme: $scheme"
          echo "Starting xcodebuild..."

          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -verbose \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log
          
          if [ $? -ne 0 ]; then
            echo "=== Build failed. Last 200 lines of xcodebuild.log ==="
            tail -n 200 xcodebuild.log
            exit 1
          fi

      - name: Package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"

          rm -rf package
          mkdir -p package/Payload
          cp -R "$app_path" package/Payload/
          (
            cd package
            zip -qry ../Sonance-unsigned.ipa Payload
          )

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-unsigned-ipa
          path: Sonance-unsigned.ipa
          retention-days: 14
