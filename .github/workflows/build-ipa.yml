name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sideloadable IPA
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select latest Xcode toolchain (Swift 6.2+)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply Swift 6.2+ compatibility patches
        run: node scripts/patch-expo-modules-jsi.js

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Ensure patches applied to iOS workspace
        run: node scripts/patch-expo-modules-jsi.js

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build without Apple signing assets
        shell: bash
        run: |
          set -euo pipefail
          
          # Debug: list ios directory contents
          echo "=== iOS directory contents ==="
          ls -la ios/
          
          # Find workspace and scheme
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "ERROR: No .xcworkspace found in ios/"
            exit 1
          fi
          
          echo "Found workspace: $workspace"
          
          scheme="$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{found=1; next} found && NF {gsub(/^[[:space:]]+/, ""); print; exit}')"
          if [ -z "$scheme" ]; then
            echo "ERROR: No scheme found in workspace"
            exit 1
          fi
          
          echo "Found scheme: $scheme"
          echo "Starting xcodebuild..."

          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "ERROR: No .app bundle found in build products"
            exit 1
          fi
          echo "Found app bundle: $app_path"

          rm -rf package Sonance-unsigned.ipa
          mkdir -p package/Payload
          cp -R "$app_path" package/Payload/
          (
            cd package
            zip -qry ../Sonance-unsigned.ipa Payload
          )

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-unsigned-ipa
          path: Sonance-unsigned.ipa
          retention-days: 14
